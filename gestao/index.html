<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Controle Financeiro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap">

<style>
  :root {
    color-scheme: light;
    --bg: #EEF3F0; --panel: #FFFFFF; --panel-2: #F7FAF8; --ink: #172624; --ink-soft: #5B6E6C; --ink-muted: #8A9A98;
    --teal: #2F6F6B; --teal-dark: #1F504C; --teal-soft: #E1EEEC;
    --amber: #B86E1C; --amber-soft: #FBEBD6;
    --red: #C0453A; --red-soft: #FBE7E4;
    --green: #2E7D4F; --green-soft: #E0F2E7;
    --line: #DEE7E3; --grid: #E8EEEB; --radius: 14px;
    /* séries dos gráficos (paleta categórica validada) */
    --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100;
    --pos: #2a78d6; --neg: #e34948;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #111816; --panel: #1A2321; --panel-2: #212C29; --ink: #EAF1EE; --ink-soft: #A9BAB6; --ink-muted: #7D8F8B;
      --teal: #4FA39C; --teal-dark: #7CC4BD; --teal-soft: #1F3532;
      --amber: #E3A55A; --amber-soft: #3A2A16;
      --red: #EE7B70; --red-soft: #3D1F1C;
      --green: #6CC48F; --green-soft: #1A3324;
      --line: #2D3A37; --grid: #26322F;
      --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
      --pos: #3987e5; --neg: #e66767;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #111816; --panel: #1A2321; --panel-2: #212C29; --ink: #EAF1EE; --ink-soft: #A9BAB6; --ink-muted: #7D8F8B;
    --teal: #4FA39C; --teal-dark: #7CC4BD; --teal-soft: #1F3532;
    --amber: #E3A55A; --amber-soft: #3A2A16;
    --red: #EE7B70; --red-soft: #3D1F1C;
    --green: #6CC48F; --green-soft: #1A3324;
    --line: #2D3A37; --grid: #26322F;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
    --pos: #3987e5; --neg: #e66767;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { font-family: 'Inter', system-ui, sans-serif; color: var(--ink); background: var(--bg); font-size: 14px; }
  button, input, select, textarea { font: inherit; color: inherit; }
  .root { padding: 16px; max-width: 1240px; margin: 0 auto; }
  h1, h2, h3 { font-family: 'Space Grotesk', sans-serif; letter-spacing: -0.01em; margin: 0; }

  /* cabeçalho */
  .head { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; margin-bottom: 14px; }
  .brand h1 { font-size: 21px; }
  .brand p { margin: 2px 0 0; font-size: 12.5px; color: var(--ink-soft); }
  .head-right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .empresa-pick { display: flex; align-items: center; gap: 8px; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 4px 6px 4px 14px; }
  .empresa-pick label { font-size: 11px; font-weight: 700; color: var(--ink-soft); text-transform: uppercase; letter-spacing: .05em; }
  .empresa-pick select { border: none; background: var(--teal-soft); color: var(--teal-dark); font-weight: 700; border-radius: 999px; padding: 7px 10px; max-width: 220px; }
  .chip { font-size: 11.5px; color: var(--ink-soft); display: inline-flex; align-items: center; gap: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); display: inline-block; }
  .dot.err { background: var(--red); }
  .dot.local { background: var(--amber); }

  .nav { display: flex; gap: 4px; background: var(--panel); padding: 5px; border-radius: 999px; border: 1px solid var(--line); margin-bottom: 16px; overflow-x: auto; scrollbar-width: none; }
  .nav button { border: none; background: transparent; padding: 9px 15px; border-radius: 999px; font-weight: 600; font-size: 13.5px; color: var(--ink-soft); cursor: pointer; white-space: nowrap; }
  .nav button:hover { color: var(--teal-dark); }
  .nav button.active { background: var(--teal); color: #fff; }

  .banner { padding: 10px 14px; border-radius: 10px; font-size: 13px; margin-bottom: 14px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .banner.amber { background: var(--amber-soft); color: var(--amber); }
  .banner.red { background: var(--red-soft); color: var(--red); }

  /* cartões */
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; min-width: 0; }
  .card + .card { margin-top: 14px; }
  .card-title { font-size: 15px; font-weight: 600; margin: 0 0 4px; font-family: 'Space Grotesk', sans-serif; }
  .card-sub { font-size: 12px; color: var(--ink-soft); margin: 0 0 12px; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 14px; }
  .kpi { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
  .kpi-label { font-size: 11px; color: var(--ink-soft); text-transform: uppercase; letter-spacing: .06em; font-weight: 700; margin: 0 0 6px; }
  .kpi-value { font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 700; margin: 0; font-variant-numeric: tabular-nums; }
  .kpi-foot { font-size: 12px; color: var(--ink-soft); margin-top: 4px; }
  .kpi.hero { background: linear-gradient(135deg, #1F504C, #2F6F6B); border: none; color: #fff; }
  .kpi.hero .kpi-label, .kpi.hero .kpi-foot { color: rgba(255,255,255,.8); }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 460px), 1fr)); gap: 14px; margin-bottom: 14px; }
  .grid2 > .card + .card { margin-top: 0; }
  .chart-box { position: relative; height: 260px; }
  .chart-box.tall { height: 320px; }

  /* filtros */
  .filters { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; margin-bottom: 14px; }
  .f { display: flex; flex-direction: column; gap: 4px; min-width: 120px; flex: 1 1 140px; }
  .f.wide { flex: 2 1 220px; }
  .f label, .fld label { font-size: 11px; font-weight: 700; color: var(--ink-soft); text-transform: uppercase; letter-spacing: .04em; }
  input, select, textarea { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 9px; background: var(--panel-2); font-size: 13.5px; }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--teal); outline-offset: 1px; }
  input[type=checkbox] { width: auto; }
  .presets { display: flex; gap: 6px; flex-wrap: wrap; width: 100%; }
  .presets button { border: 1px solid var(--line); background: var(--panel-2); color: var(--ink-soft); border-radius: 999px; padding: 5px 11px; font-size: 12px; font-weight: 600; cursor: pointer; }
  .presets button.on { background: var(--teal-soft); color: var(--teal-dark); border-color: var(--teal); }

  /* botões */
  .btn { border: none; background: var(--teal); color: #fff; padding: 9px 16px; border-radius: 9px; font-weight: 600; font-size: 13.5px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .btn:hover { filter: brightness(1.08); }
  .btn.ghost { background: transparent; color: var(--ink-soft); border: 1px solid var(--line); }
  .btn.red { background: var(--red); }
  .btn.sm { padding: 6px 10px; font-size: 12.5px; }
  .btn:disabled { opacity: .45; cursor: not-allowed; filter: none; }
  .perm-tbl td, .perm-tbl th { padding: 6px 6px; }
  .perm-tbl input[type=checkbox] { width: 17px; height: 17px; accent-color: var(--teal); }
  .ibtn { border: none; background: none; color: var(--ink-soft); cursor: pointer; padding: 5px 7px; border-radius: 7px; font-size: 12.5px; font-weight: 600; white-space: nowrap; }
  .ibtn:hover { background: var(--teal-soft); color: var(--teal-dark); }
  .ibtn.danger:hover { background: var(--red-soft); color: var(--red); }
  .toolbar { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
  .toolbar .actions { display: flex; gap: 8px; flex-wrap: wrap; }

  /* tabelas */
  .tbl-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-soft); font-weight: 700; padding: 8px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  td { padding: 9px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  td.acts { text-align: right; white-space: nowrap; }
  .muted { color: var(--ink-soft); font-size: 12px; }
  .empty { color: var(--ink-soft); font-size: 13px; padding: 18px 4px; text-align: center; }
  .tag { font-size: 11px; padding: 3px 9px; border-radius: 999px; font-weight: 700; white-space: nowrap; display: inline-block; }
  .tag.receber, .tag.pago, .tag.ok, .tag.entrada { background: var(--green-soft); color: var(--green); }
  .tag.pagar, .tag.vencido, .tag.zerado, .tag.saida { background: var(--red-soft); color: var(--red); }
  .tag.pendente, .tag.baixo, .tag.ajuste { background: var(--amber-soft); color: var(--amber); }
  .tag.cancelado { background: var(--panel-2); color: var(--ink-muted); text-decoration: line-through; }
  .val-in { color: var(--green); font-weight: 600; }
  .val-out { color: var(--red); font-weight: 600; }
  .totals { display: flex; gap: 18px; flex-wrap: wrap; font-size: 13px; padding: 10px 2px 2px; color: var(--ink-soft); }
  .totals b { color: var(--ink); font-variant-numeric: tabular-nums; }

  /* modal */
  .modal-bg { position: fixed; inset: 0; background: rgba(10,20,18,.5); display: flex; align-items: flex-start; justify-content: center; padding: 30px 12px; overflow-y: auto; z-index: 50; }
  .modal { background: var(--panel); border-radius: 16px; width: 100%; max-width: 620px; padding: 20px; box-shadow: 0 20px 50px rgba(0,0,0,.3); }
  .modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .modal-head h2 { font-size: 18px; }
  .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 170px), 1fr)); gap: 12px; }
  .fld { display: flex; flex-direction: column; gap: 4px; }
  .fld.full { grid-column: 1 / -1; }
  .check { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; }
  .modal-foot { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
  .sub-box { grid-column: 1 / -1; border: 1px dashed var(--line); border-radius: 10px; padding: 12px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 170px), 1fr)); gap: 12px; }
  .hint { font-size: 12px; color: var(--ink-soft); grid-column: 1 / -1; margin: 0; }

  /* login */
  .login { max-width: 380px; margin: 9vh auto; }
  .login h1 { font-size: 24px; margin-bottom: 4px; }
  .login form { display: flex; flex-direction: column; gap: 12px; margin-top: 16px; }
  .err-msg { color: var(--red); font-size: 13px; }
  .linkbtn { background: none; border: none; color: var(--teal-dark); cursor: pointer; text-decoration: underline; font-size: 13px; padding: 0; }
  code { background: var(--panel-2); padding: 1px 5px; border-radius: 5px; font-size: 12.5px; }

  .list-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 2px; border-bottom: 1px solid var(--line); font-size: 13px; }
  .list-row:last-child { border-bottom: none; }

  @media (max-width: 640px) {
    .root { padding: 12px 16px; }
    .kpi-value { font-size: 19px; }
    .hide-sm { display: none; }
  }
</style>
</head>

<script>
// ==========================================================
// CONFIGURAÇÃO DO SUPABASE (mesmo projeto do controle de caixa)
// Painel do Supabase > Settings > API. Deixe vazio para usar o modo local.
// ==========================================================
const SUPABASE_URL = "https://rqyxigyabvpfovhhgetm.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_mOidO636lc40mqWAONsn9A_Enr8NDRF";

const TABLES = ['empresas', 'parceiros', 'servicos', 'lancamentos', 'produtos', 'movimentos_estoque', 'categorias', 'formas_compra', 'tecnicos', 'atendimentos', 'niveis_acesso', 'perfis'];
// tabelas de dados de negócio (as de usuários/níveis só existem online)
const DATA_TABLES = ['empresas', 'parceiros', 'servicos', 'lancamentos', 'produtos', 'movimentos_estoque', 'categorias', 'formas_compra', 'tecnicos', 'atendimentos'];

// ---------- níveis de acesso: o que cada módulo permite ----------
const MODULOS = [
  ['dashboard', 'Dashboard', ['ver']],
  ['contas_receber', 'Contas a receber', ['ver', 'criar', 'editar', 'baixar', 'excluir', 'exportar']],
  ['contas_pagar', 'Contas a pagar', ['ver', 'criar', 'editar', 'baixar', 'excluir', 'exportar']],
  ['parceiros', 'Clientes e fornecedores', ['ver', 'criar', 'editar', 'excluir']],
  ['servicos', 'Serviços', ['ver', 'criar', 'editar', 'excluir']],
  ['estoque', 'Estoque', ['ver', 'criar', 'editar', 'movimentar', 'excluir']],
  ['categorias', 'Categorias', ['ver', 'criar', 'editar', 'excluir']],
  ['empresas', 'Empresas', ['ver', 'criar', 'editar', 'excluir']],
  ['importar', 'Importar dados', ['usar']],
  ['backup', 'Backup', ['exportar', 'importar']]
];
const ACOES = { ver: 'Ver', criar: 'Criar', editar: 'Editar', baixar: 'Dar baixa', excluir: 'Excluir', exportar: 'Exportar', movimentar: 'Movimentar', usar: 'Usar', importar: 'Importar' };
const ACOES_ORDEM = ['ver', 'criar', 'editar', 'baixar', 'movimentar', 'excluir', 'exportar', 'importar', 'usar'];
const FORMAS_PAGAMENTO = ['Pix', 'Dinheiro', 'Cartão de crédito', 'Cartão de débito', 'Boleto', 'Transferência', 'Outro'];

// ---------- utilidades ----------
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function num(v) { const n = Number(v); return isFinite(n) ? n : 0; }
function brl(v) { return num(v).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' }); }
function brlShort(v) {
  const n = num(v), a = Math.abs(n);
  if (a >= 1e6) return 'R$ ' + (n / 1e6).toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + ' mi';
  if (a >= 1e3) return 'R$ ' + (n / 1e3).toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + ' mil';
  return 'R$ ' + n.toLocaleString('pt-BR', { maximumFractionDigits: 0 });
}
function qty(v) { return num(v).toLocaleString('pt-BR', { maximumFractionDigits: 3 }); }
function isoLocal(d) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; }
function today() { return isoLocal(new Date()); }
function parseISO(iso) { const [y, m, d] = iso.split('-').map(Number); return new Date(y, m - 1, d); }
function addDays(iso, n) { const d = parseISO(iso); d.setDate(d.getDate() + n); return isoLocal(d); }
function addMonths(iso, n) {
  const [y, m, d] = iso.split('-').map(Number);
  const last = new Date(y, m - 1 + n + 1, 0).getDate(); // evita 31/01 + 1 mês virar 03/03
  return isoLocal(new Date(y, m - 1 + n, Math.min(d, last)));
}
function fmtDate(iso) { if (!iso) return ''; const [y, m, d] = iso.slice(0, 10).split('-'); return `${d}/${m}/${y}`; }
const MESES = ['Jan', 'Fev', 'Mar', 'Abr', 'Mai', 'Jun', 'Jul', 'Ago', 'Set', 'Out', 'Nov', 'Dez'];
function monthLabel(key) { const [y, m] = key.split('-'); return `${MESES[Number(m) - 1]}/${y.slice(2)}`; }
function newId() { return (crypto.randomUUID ? crypto.randomUUID() : 'id-' + Date.now().toString(36) + Math.random().toString(36).slice(2)); }
function lsGet(k) { try { return localStorage.getItem('gestao-a100:' + k); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem('gestao-a100:' + k, v); } catch (e) { } }
function presetRange(p) {
  const t = today(), d = parseISO(t), y = d.getFullYear(), m = d.getMonth();
  switch (p) {
    case 'mes': return [isoLocal(new Date(y, m, 1)), isoLocal(new Date(y, m + 1, 0))];
    case 'mes_ant': return [isoLocal(new Date(y, m - 1, 1)), isoLocal(new Date(y, m, 0))];
    case 'prox30': return [t, addDays(t, 30)];
    case 'ult12': return [isoLocal(new Date(y, m - 11, 1)), isoLocal(new Date(y, m + 1, 0))];
    case 'ano': return [`${y}-01-01`, `${y}-12-31`];
    default: return ['', ''];
  }
}
const PRESETS = [['mes', 'Este mês'], ['mes_ant', 'Mês passado'], ['prox30', 'Próximos 30 dias'], ['ult12', 'Últimos 12 meses'], ['ano', 'Este ano'], ['tudo', 'Tudo']];

// ==========================================================
// CAMADA DE DADOS — Supabase (online) ou localStorage (modo local)
// ==========================================================
let sb = null;
let mode = 'supabase';
let user = null;
let syncState = 'ok'; // ok | err | local

const LocalDB = {
  KEY: 'gestao-a100:db',
  read() { try { return JSON.parse(localStorage.getItem(this.KEY)) || {}; } catch (e) { return {}; } },
  write(db) { localStorage.setItem(this.KEY, JSON.stringify(db)); },
  async list(t) { return this.read()[t] || []; },
  async insert(t, rows) {
    const db = this.read(); db[t] = db[t] || [];
    const out = rows.map(r => ({ id: newId(), created_at: new Date().toISOString(), ...r }));
    if (t === 'atendimentos') out.forEach(a => {
      const l = { id: newId(), created_at: new Date().toISOString(), tipo: 'receber', categoria: 'Serviços', ...contaDoAtendimento(a, db),
        status: a.ja_recebido ? 'pago' : 'pendente', pagamento: a.ja_recebido ? a.data : null, valor_pago: a.ja_recebido ? a.valor : null };
      (db.lancamentos = db.lancamentos || []).push(l);
      a.lancamento_id = l.id;
    });
    db[t].push(...out); this.write(db); return out;
  },
  async update(t, id, patch) {
    const db = this.read(); let row = null;
    db[t] = (db[t] || []).map(r => r.id === id ? (row = { ...r, ...patch }) : r);
    if (t === 'atendimentos' && row?.lancamento_id) db.lancamentos = (db.lancamentos || []).map(l => l.id === row.lancamento_id ? { ...l, ...contaDoAtendimento(row, db) } : l);
    this.write(db); return row;
  },
  async remove(t, id) {
    // replica as regras "on delete" do schema.sql
    const db = this.read();
    TABLES.forEach(x => db[x] = db[x] || []);
    db[t] = db[t].filter(r => r.id !== id);
    if (t === 'atendimentos') { const a = (this.read().atendimentos || []).find(r => r.id === id); if (a?.lancamento_id) db.lancamentos = db.lancamentos.filter(l => l.id !== a.lancamento_id || l.status === 'pago'); }
    const nula = (tab, campo) => db[tab] = db[tab].map(r => r[campo] === id ? { ...r, [campo]: null } : r);
    if (t === 'parceiros') nula('atendimentos', 'parceiro_id');
    if (t === 'servicos') nula('atendimentos', 'servico_id');
    if (t === 'tecnicos') nula('atendimentos', 'tecnico_id');
    if (t === 'lancamentos') nula('atendimentos', 'lancamento_id');
    if (t === 'empresas') ['parceiros', 'servicos', 'lancamentos', 'produtos', 'movimentos_estoque', 'categorias', 'atendimentos'].forEach(x => db[x] = db[x].filter(r => r.empresa_id !== id));
    if (t === 'produtos') db.movimentos_estoque = db.movimentos_estoque.filter(r => r.produto_id !== id);
    if (t === 'parceiros') db.lancamentos = db.lancamentos.map(r => r.parceiro_id === id ? { ...r, parceiro_id: null } : r);
    if (t === 'servicos') db.lancamentos = db.lancamentos.map(r => r.servico_id === id ? { ...r, servico_id: null } : r);
    if (t === 'lancamentos') db.movimentos_estoque = db.movimentos_estoque.map(r => r.lancamento_id === id ? { ...r, lancamento_id: null } : r);
    this.write(db);
  }
};

const RemoteDB = {
  async list(t) {
    // o Supabase devolve no máximo 1000 linhas por consulta: pagina até acabar
    const out = []; const page = 1000;
    for (let from = 0; ; from += page) {
      const { data, error } = await sb.from(t).select('*').order('created_at').range(from, from + page - 1);
      if (error) throw error;
      out.push(...data);
      if (data.length < page) break;
    }
    return out;
  },
  async insert(t, rows) { const { data, error } = await sb.from(t).insert(rows).select(); if (error) throw error; return data; },
  async update(t, id, patch) {
    const { data, error } = await sb.from(t).update(patch).eq(t === 'perfis' ? 'user_id' : 'id', id).select();
    if (error) throw error;
    if (!data.length) throw new Error('Sem permissão para alterar este registro.');
    return data[0];
  },
  async remove(t, id) {
    const { data, error } = await sb.from(t).delete().eq(t === 'perfis' ? 'user_id' : 'id', id).select();
    if (error) throw error;
    if (!data.length) throw new Error('Sem permissão para excluir este registro.');
  },
  async rpc(fn, args) { const { error } = await sb.rpc(fn, args); if (error) throw error; }
};

let meuPerfil = null, minhasPerms = {};

function can(mod, acao) {
  if (souAdmin()) return true;
  return !!(meuPerfil?.ativo && Array.isArray(minhasPerms[mod]) && minhasPerms[mod].includes(acao));
}
function modConta(tipo) { return tipo === 'pagar' ? 'contas_pagar' : 'contas_receber'; }

// mensagens de erro do banco em português
function msgErro(e) {
  const m = String(e?.message || e || '');
  if (/row-level security|permission denied|Sem permissão/i.test(m)) return m.startsWith('Sem permissão') ? m : 'Você não tem permissão para esta ação.';
  if (/duplicate key/i.test(m)) return 'Já existe um registro com esse nome.';
  if (/Failed to fetch|NetworkError/i.test(m)) return 'Sem conexão com o servidor. Verifique a internet.';
  return m;
}

function isMissingTable(e) {
  const msg = String(e && (e.message || e.code) || '');
  return e && (e.code === 'PGRST205' || e.code === '42P01' || /does not exist|schema cache/i.test(msg));
}

  let de = DF.de, ate = DF.ate;
  if (!de) de = pagos.reduce((m, l) => l.pagamento < m ? l.pagamento : m, t);
  if (!ate) ate = pagos.reduce((m, l) => l.pagamento > m ? l.pagamento : m, t);
  const months = [];
  for (let k = de.slice(0, 7); k <= ate.slice(0, 7) && months.length < 60; k = addMonths(k + '-01', 1).slice(0, 7)) months.push(k);
  const rec = months.map(k => pagos.filter(l => l.tipo === 'receber' && l.pagamento.startsWith(k)).reduce((s, l) => s + valorReal(l), 0));
  const pag = months.map(k => pagos.filter(l => l.tipo === 'pagar' && l.pagamento.startsWith(k)).reduce((s, l) => s + valorReal(l), 0));
  const res = months.map((_, i) => rec[i] - pag[i]);
  const C = cssColors();
  barChart('chFluxo', months.map(monthLabel), [
    { label: 'Recebido', data: rec, backgroundColor: C.s1 },
    { label: 'Pago', data: pag, backgroundColor: C.s2 }
  ]);
  barChart('chResultado', months.map(monthLabel), [{ label: 'Resultado', data: res, backgroundColor: res.map(v => v >= 0 ? C.pos : C.neg) }], { legend: false });

  // previsão semanal
  const wkLabels = ['Vencidas'], wkRec = [sum(recVenc)], wkPag = [sum(pagVenc)];
  for (let w = 0; w < 12; w++) {
    const ini = addDays(t, w * 7), fim = addDays(t, w * 7 + 6);
    wkLabels.push(fmtDate(ini).slice(0, 5));
    const inW = abertos.filter(l => l.vencimento >= ini && l.vencimento <= fim);
    wkRec.push(sum(inW.filter(l => l.tipo === 'receber')));
    wkPag.push(sum(inW.filter(l => l.tipo === 'pagar')));
  }
  barChart('chPrev', wkLabels, [{ label: 'A receber', data: wkRec, backgroundColor: C.s1 }, { label: 'A pagar', data: wkPag, backgroundColor: C.s2 }]);

  const recPagos = pagos.filter(l => l.tipo === 'receber');
  rankChart('chServ', groupSum(recPagos, l => servico(l.servico_id)?.nome || 'Sem serviço'), C.s1, 'Recebido');
  rankChart('chCli', groupSum(recPagos, l => parceiro(l.parceiro_id)?.nome || 'Sem cliente'), C.s1, 'Recebido');
  rankChart('chDesp', groupSum(pagos.filter(l => l.tipo === 'pagar'), l => l.categoria || 'Sem categoria'), C.s2, 'Pago');
  if (document.getElementById('chEmp')) {
    const emps = D.empresas;
    barChart('chEmp', emps.map(e => e.nome), [
      { label: 'Recebido', data: emps.map(e => pagos.filter(l => l.empresa_id === e.id && l.tipo === 'receber').reduce((s, l) => s + valorReal(l), 0)), backgroundColor: C.s1 },
      { label: 'Pago', data: emps.map(e => pagos.filter(l => l.empresa_id === e.id && l.tipo === 'pagar').reduce((s, l) => s + valorReal(l), 0)), backgroundColor: C.s2 }
    ]);
  }
}

function groupSum(rows, keyFn) {
  const m = new Map();
  rows.forEach(l => m.set(keyFn(l), (m.get(keyFn(l)) || 0) + valorReal(l)));
  let arr = [...m.entries()].sort((a, b) => b[1] - a[1]);
  if (arr.length > 8) { const rest = arr.slice(7).reduce((s, x) => s + x[1], 0); arr = [...arr.slice(0, 7), ['Outros', rest]]; }
  return arr;
}
function cssColors() {
  const cs = getComputedStyle(document.documentElement);
  const g = k => cs.getPropertyValue(k).trim();
  return { s1: g('--s1'), s2: g('--s2'), pos: g('--pos'), neg: g('--neg'), ink: g('--ink-soft'), grid: g('--grid'), panel: g('--panel') };
}
function chartBase(horizontal, legend) {
  const C = cssColors();
  const moneyAxis = { grid: { color: C.grid }, border: { display: false }, ticks: { color: C.ink, maxRotation: 0, maxTicksLimit: 6, callback: v => brlShort(v) } };
  const catAxis = { grid: { display: false }, border: { color: C.grid }, ticks: { color: C.ink, autoSkip: true, maxRotation: 0 } };
  return {
    responsive: true, maintainAspectRatio: false, indexAxis: horizontal ? 'y' : 'x',
    interaction: { mode: horizontal ? 'nearest' : 'index', intersect: false, axis: horizontal ? 'y' : 'x' },
    plugins: {
      legend: { display: legend, position: 'top', align: 'start', labels: { color: C.ink, boxWidth: 10, boxHeight: 10, useBorderRadius: true, borderRadius: 3 } },
      tooltip: { callbacks: { label: ctx => `${ctx.dataset.label}: ${brl(horizontal ? ctx.parsed.x : ctx.parsed.y)}` } }
    },
    scales: horizontal ? { x: moneyAxis, y: catAxis } : { x: catAxis, y: moneyAxis }
  };
}
function barChart(id, labels, datasets, { legend = true } = {}) {
  const el = document.getElementById(id); if (!el || !window.Chart) return;
  const C = cssColors();
  datasets.forEach(d => Object.assign(d, { borderRadius: 4, borderSkipped: 'start', maxBarThickness: 28, borderWidth: 0, categoryPercentage: 0.7, barPercentage: 0.9 }));
  charts[id] = new Chart(el, { type: 'bar', data: { labels, datasets }, options: chartBase(false, legend) });
}
function rankChart(id, pairs, color, label) {
  const el = document.getElementById(id); if (!el) return;
  if (!pairs.length) { el.parentElement.innerHTML = '<p class="empty">Sem dados no período.</p>'; return; }
  if (!window.Chart) return;
  charts[id] = new Chart(el, {
    type: 'bar',
    data: { labels: pairs.map(p => p[0].length > 26 ? p[0].slice(0, 25) + '…' : p[0]), datasets: [{ label, data: pairs.map(p => p[1]), backgroundColor: color, borderRadius: 4, borderSkipped: 'start', maxBarThickness: 22 }] },
    options: chartBase(true, false)
  });
}

function setF(k, v) { F[k] = v; if (k === 'de' || k === 'ate') F.preset = ''; renderContasLista(); }
function setContasPreset(p) { F.preset = p; [F.de, F.ate] = presetRange(p); renderTab(); }
function limparFiltros() { Object.assign(F, { tipo: '', status: '', parceiro: '', servico: '', categoria: '', formaCompra: '', q: '' }); setContasPreset('tudo'); }
function verContasDe(campo, id) { limparFiltros(); F[campo] = id; setTab('contas'); }

function filtrarContas() {
  const q = F.q.trim().toLowerCase();
  return escopo(D.lancamentos).filter(l => {
    if (F.tipo && l.tipo !== F.tipo) return false;
    const st = statusEf(l);
    if (F.status === 'aberto' ? !(st === 'pendente' || st === 'vencido') : (F.status && st !== F.status)) return false;
    if (F.parceiro && l.parceiro_id !== F.parceiro) return false;
    if (F.servico && l.servico_id !== F.servico) return false;
    if (F.categoria && l.categoria !== F.categoria) return false;
    if (F.formaCompra && (l.tipo !== 'pagar' || (F.formaCompra === '-' ? !!l.forma_compra : l.forma_compra !== F.formaCompra))) return false;
    const d = F.campo === 'pagamento' ? l.pagamento : l.vencimento;
    if ((F.de || F.ate) && !inPeriod(d, F.de, F.ate)) return false;
    if (q) {
      const hay = [l.descricao, parceiro(l.parceiro_id)?.nome, servico(l.servico_id)?.nome, l.categoria, l.observacao, l.forma_pagamento, l.forma_compra].join(' ').toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  }).sort((a, b) => (a.vencimento || '').localeCompare(b.vencimento || '') || (a.descricao || '').localeCompare(b.descricao || ''));
}

      <div class="f"><label>Cliente / fornecedor</label><select onchange="setF('parceiro', this.value)">${opts(parcs.map(p => [p.id, p.nome]), F.parceiro, 'Todos')}</select></div>
      <div class="f"><label>Serviço</label><select onchange="setF('servico', this.value)">${opts(servs.map(s => [s.id, s.nome]), F.servico, 'Todos')}</select></div>
      <div class="f"><label>Categoria</label><select onchange="setF('categoria', this.value)">${opts(categorias().map(c => [c, c]), F.categoria, 'Todas')}</select></div>

      <div class="f"><label>Filtrar data por</label><select onchange="setF('campo', this.value)">${opts([['vencimento', 'Vencimento'], ['pagamento', 'Pagamento']], F.campo)}</select></div>

      <div class="f"><label>Até</label><input type="date" value="${F.ate}" onchange="setF('ate', this.value); renderTab()"></div>
      ${presetButtons(F, 'setContasPreset')}
      <button class="linkbtn" onclick="limparFiltros()">Limpar filtros</button>
    </div>

  renderContasLista();
}

function renderContasLista() {
  const el = document.getElementById('contasLista'); if (!el) return;
  const rows = filtrarContas();
  const ativos = rows.filter(l => l.status !== 'cancelado');
  const tot = (tipo, fn) => ativos.filter(l => l.tipo === tipo && fn(l)).reduce((s, l) => s + valorReal(l), 0);
  const all = () => true, aberto = l => l.status === 'pendente', quit = l => l.status === 'pago';

  el.innerHTML = rows.length ? `
    <div class="tbl-wrap"><table>
      <thead><tr><th>Vencimento</th>${multi ? '<th>Empresa</th>' : ''}<th>Descrição</th><th class="hide-sm">Cliente / fornecedor</th><th class="hide-sm">Serviço / categoria</th>${colForma ? '<th class="hide-sm">Forma de compra</th>' : ''}<th class="num">Valor</th><th>Situação</th><th></th></tr></thead>
      <tbody>${rows.map(l => {

        return `<tr>
          <td>${fmtDate(l.vencimento)}${l.pagamento ? `<div class="muted">pago ${fmtDate(l.pagamento)}</div>` : ''}</td>

          <td class="hide-sm">${esc(parceiro(l.parceiro_id)?.nome || '—')}</td>
          <td class="hide-sm">${esc(servico(l.servico_id)?.nome || '')}${l.categoria ? `<div class="muted">${esc(l.categoria)}</div>` : ''}</td>
          ${colForma ? `<td class="hide-sm">${l.tipo === 'pagar' ? esc(l.forma_compra || '—') : ''}</td>` : ''}
          <td class="num ${l.tipo === 'pagar' ? 'val-out' : 'val-in'}">${brl(valorReal(l))}</td>

            ${l.status === 'pendente' && podeBaixar(l.tipo) ? `<button class="ibtn" onclick="formBaixa('${l.id}')">${l.tipo === 'pagar' ? 'Pagar' : 'Receber'}</button>` : ''}
            ${l.status === 'pago' && podeBaixar(l.tipo) ? `<button class="ibtn" onclick="estornar('${l.id}')">Estornar</button>` : ''}
            ${canConta(l.tipo, 'editar') ? `<button class="ibtn" onclick="formConta('${l.id}')">Editar</button>` : ''}

    <div class="totals">
      <span>${rows.length} lançamento(s)</span>
      <span>A receber: <b class="val-in">${brl(tot('receber', all))}</b> <span class="muted">(${brl(tot('receber', quit))} recebido · ${brl(tot('receber', aberto))} em aberto)</span></span>
      <span>A pagar: <b class="val-out">${brl(tot('pagar', all))}</b> <span class="muted">(${brl(tot('pagar', quit))} pago · ${brl(tot('pagar', aberto))} em aberto)</span></span>
      <span>Saldo: <b>${brl(tot('receber', all) - tot('pagar', all))}</b></span>
    </div>` : '<p class="empty">Nenhum lançamento encontrado com esses filtros.</p>';
}

function podeBaixar(tipo) { return canConta(tipo, 'baixar') || canConta(tipo, 'editar'); }
function exportCSV() {
  const rows = filtrarContas().filter(l => canConta(l.tipo, 'exportar'));
  const head = ['Empresa', 'Tipo', 'Descrição', 'Cliente/Fornecedor', 'Serviço', 'Categoria', 'Forma de compra', 'Vencimento', 'Valor', 'Situação', 'Pagamento', 'Valor pago', 'Forma', 'Observação'];
  const cell = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
  const money = v => v == null || v === '' ? '' : num(v).toFixed(2).replace('.', ',');
  const lines = rows.map(l => [nomeEmpresa(l.empresa_id), l.tipo === 'pagar' ? 'A pagar' : 'A receber', l.descricao, parceiro(l.parceiro_id)?.nome, servico(l.servico_id)?.nome, l.categoria, l.forma_compra,
    fmtDate(l.vencimento), money(l.valor), STATUS_LABEL[statusEf(l)], fmtDate(l.pagamento), money(l.valor_pago), l.forma_pagamento, l.observacao].map(cell).join(';'));
  download(`contas-${today()}.csv`, '﻿' + [head.map(cell).join(';'), ...lines].join('\r\n'), 'text/csv;charset=utf-8');
}
function download(name, content, type) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([content], { type }));
  a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

// ---- formulário de conta ----
function parceiroOptsFor(emp, sel, tipo) {
  const want = tipo === 'pagar' ? ['fornecedor', 'ambos'] : ['cliente', 'ambos'];
  const list = escopoCompart(D.parceiros, emp).sort((a, b) => (want.includes(b.tipo) - want.includes(a.tipo)) || a.nome.localeCompare(b.nome, 'pt-BR'));
  return opts(list.map(p => [p.id, p.nome + (want.includes(p.tipo) ? '' : ` (${TIPO_PARC[p.tipo].toLowerCase()})`)]), sel, '— nenhum —');
}
function servicoOptsFor(emp, sel) { return opts(escopoCompart(D.servicos, emp).map(s => [s.id, `${s.nome} · ${brl(s.preco)}`]), sel, '— nenhum —'); }
function refreshContaSelects() {
  const f = document.getElementById('mform'); if (!f) return;
  const emp = f.empresa_id.value, tipo = f.tipo.value;
  f.parceiro_id.innerHTML = parceiroOptsFor(emp, f.parceiro_id.value, tipo);
  f.servico_id.innerHTML = servicoOptsFor(emp, f.servico_id.value);
  f.categoria.innerHTML = categoriaOptsFor(emp, tipo, f.categoria.value);
  toggleBox('fldFormaCompra', tipo === 'pagar');
}
function formasCompraAtivas() { return D.formas_compra.filter(x => x.ativo !== false).sort((a, b) => a.nome.localeCompare(b.nome, 'pt-BR')); }
function formaCompraOpts(sel) {
  const list = formasCompraAtivas().map(x => [x.nome, x.nome]);
  if (sel && !list.some(([n]) => n === sel)) list.unshift([sel, sel]);
  return opts(list, sel, '— não informada —');
}
function onServicoPick(sel) {
  const s = servico(sel.value), f = sel.form;
  if (s && !num(f.valor.value)) f.valor.value = num(s.preco).toFixed(2);
  if (s && !f.descricao.value) f.descricao.value = s.nome;
}
function toggleBox(id, on) { const el = document.getElementById(id); if (el) el.style.display = on ? '' : 'none'; }

function formConta(id, tipoNovo) {
  const l = id ? lancamento(id) : null;
  const tipo = l ? l.tipo : (tipoNovo || 'receber');
  const emp = l ? l.empresa_id : (empresaAtual || D.empresas[0]?.id);

        <div class="fld"><label>Empresa</label><select name="empresa_id" required onchange="refreshContaSelects()">${empresaOpts(emp)}</select></div>
        <div class="fld full"><label>Descrição</label><input name="descricao" required maxlength="200" value="${esc(l?.descricao)}" placeholder="Ex.: Lavagem de enxoval — hotel"></div>
        <div class="fld"><label>Cliente / fornecedor</label><select name="parceiro_id">${parceiroOptsFor(emp, l?.parceiro_id, tipo)}</select></div>
        <div class="fld"><label>Serviço</label><select name="servico_id" onchange="onServicoPick(this)">${servicoOptsFor(emp, l?.servico_id)}</select></div>

        <div class="fld"><label>Valor (R$)</label><input name="valor" type="number" step="0.01" min="0" required value="${l ? num(l.valor).toFixed(2) : ''}"></div>
        <div class="fld"><label>Vencimento</label><input name="vencimento" type="date" required value="${l?.vencimento || today()}"></div>
        ${l ? '' : `<div class="fld"><label>Parcelas / repetições mensais</label><input name="parcelas" type="number" min="1" max="120" value="1"></div>`}
        <div class="fld full"><label class="check"><input type="checkbox" name="quitado" ${pago ? 'checked' : ''} onchange="toggleBox('boxPago', this.checked)"> Já foi ${tipo === 'pagar' ? 'paga' : 'recebida'}${l ? '' : ' (vale para a 1ª parcela)'}</label></div>

          <div class="fld"><label>Forma</label><select name="forma_pagamento">${opts(FORMAS_PAGAMENTO.map(x => [x, x]), l?.forma_pagamento, '—')}</select></div>
        </div>
        ${l ? `<div class="fld"><label class="check"><input type="checkbox" name="cancelado" ${l.status === 'cancelado' ? 'checked' : ''}> Cancelado</label></div>` : ''}
        <div class="fld full"><label>Observação</label><textarea name="observacao" rows="2">${esc(l?.observacao)}</textarea></div>
      </div>
      <div class="modal-foot"><button type="button" class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn">Salvar</button></div>
    </form>`);
}

function salvarConta(ev, id) {
  ev.preventDefault();
  const f = ev.target, v = Object.fromEntries(new FormData(f));
  const quitado = !!v.quitado;
  const base = {
    tipo: v.tipo, empresa_id: v.empresa_id, descricao: v.descricao.trim(),
    parceiro_id: v.parceiro_id || null, servico_id: v.servico_id || null, categoria: v.categoria.trim() || null,
    forma_compra: v.tipo === 'pagar' ? (v.forma_compra || null) : null,
    valor: num(v.valor), vencimento: v.vencimento, observacao: v.observacao.trim() || null
  };
  const quit = quitado
    ? { status: 'pago', pagamento: v.pagamento || today(), valor_pago: v.valor_pago === '' ? num(v.valor) : num(v.valor_pago), forma_pagamento: v.forma_pagamento || null }
    : { status: 'pendente', pagamento: null, valor_pago: null };
  if (id) {
    const row = { ...base, ...quit };
    if (v.cancelado) row.status = 'cancelado';
    run(() => DB().update('lancamentos', id, row), 'Lançamento atualizado');
  } else {
    const n = Math.max(1, Math.min(120, parseInt(v.parcelas) || 1));
    const grupo = n > 1 ? newId() : null;
    const rows = [];
    for (let i = 0; i < n; i++) {
      rows.push({
        ...base, ...(i === 0 ? quit : { status: 'pendente', pagamento: null, valor_pago: null }),
        vencimento: addMonths(base.vencimento, i),
        descricao: n > 1 ? `${base.descricao} (${i + 1}/${n})` : base.descricao,
        grupo_parcela: grupo, parcela_num: n > 1 ? i + 1 : null, parcela_total: n > 1 ? n : null
      });
    }
    run(() => DB().insert('lancamentos', rows), n > 1 ? `${n} parcelas criadas` : 'Lançamento criado');
  }
  return false;
}

function estornar(id) {

async function excluirConta(id) {
  const l = lancamento(id); if (!l) return;
  let ids = [id];
  if (l.grupo_parcela) {
    const irmas = D.lancamentos.filter(x => x.grupo_parcela === l.grupo_parcela && x.status === 'pendente' && x.id !== id);
    if (irmas.length && confirm(`Esta conta faz parte de um parcelamento. Excluir também as ${irmas.length} outras parcelas pendentes?\n\nOK = excluir todas · Cancelar = só esta`)) ids = [id, ...irmas.map(x => x.id)];
    else if (!confirm('Excluir esta parcela?')) return;
  } else if (!confirm(`Excluir "${l.descricao}"?`)) return;
  run(async () => { for (const x of ids) await DB().remove('lancamentos', x); }, 'Excluído');
}

const NUM_FIELDS = ['preco', 'estoque_minimo', 'custo', 'preco_venda'];
function salvarSimples(ev, table, id) {
  ev.preventDefault();

  for (const [k, v] of new FormData(ev.target)) row[k] = NUM_FIELDS.includes(k) ? num(v) : (String(v).trim() || null);

}

function filtrarAtendimentos() {
  const q = AF.q.trim().toLowerCase();
  return escopo(D.atendimentos).filter(a => {
    if (AF.parceiro && a.parceiro_id !== AF.parceiro) return false;
    if (AF.tecnico && a.tecnico_id !== AF.tecnico) return false;
    if (AF.laudo && (AF.laudo === 'sim') !== !!a.laudo) return false;
    const st = situacaoAtendimento(a);
    if (AF.receb === 'aberto' ? !(st === 'pendente' || st === 'vencido') : (AF.receb && st !== AF.receb)) return false;
    if ((AF.de || AF.ate) && !inPeriod(a.data, AF.de, AF.ate)) return false;
    if (q && ![a.descricao, a.orcamento, parceiro(a.parceiro_id)?.nome, tecnico(a.tecnico_id)?.nome, a.forma_pagamento, a.observacao].join(' ').toLowerCase().includes(q)) return false;

function salvarProduto(ev, id) {
  ev.preventDefault();

  const row = { nome: v.nome.trim(), empresa_id: v.empresa_id, sku: v.sku.trim() || null, unidade: v.unidade.trim() || 'un', estoque_minimo: num(v.estoque_minimo), custo: num(v.custo), preco_venda: num(v.preco_venda) };
  if (id) { run(() => DB().update('produtos', id, row), 'Produto atualizado'); return false; }
  run(async () => {
    const [p] = await DB().insert('produtos', [row]);
    if (num(v.inicial) > 0) await DB().insert('movimentos_estoque', [{ empresa_id: p.empresa_id, produto_id: p.id, tipo: 'entrada', quantidade: num(v.inicial), valor_unitario: p.custo, data: today(), observacao: 'Estoque inicial' }]);
  }, 'Produto criado');
  return false;
}

function salvarMov(ev) {
  ev.preventDefault();
  const v = Object.fromEntries(new FormData(ev.target));
  const p = produto(v.produto_id); if (!p) return false;
  let q = num(v.quantidade);
  if (v.tipo !== 'ajuste') q = Math.abs(q);
  if (!q) { alert('Informe a quantidade.'); return false; }
  if (v.tipo === 'saida' && q > saldoProduto(p.id) && !confirm(`A saída (${qty(q)}) é maior que o saldo atual (${qty(saldoProduto(p.id))}). Continuar mesmo assim?`)) return false;
  const vu = num(v.valor_unitario);
  run(async () => {
    let lancId = null;
    if (v.gerar && v.tipo !== 'ajuste' && q * vu > 0) {
      const tipoConta = v.tipo === 'entrada' ? 'pagar' : 'receber';
      const quit = !!v.quitado;
      const [l] = await DB().insert('lancamentos', [{
        empresa_id: p.empresa_id, tipo: tipoConta,
        descricao: `${v.tipo === 'entrada' ? 'Compra' : 'Venda'} de ${qty(q)} ${p.unidade} ${p.nome}`,
        parceiro_id: v.parceiro_id || null, categoria: v.tipo === 'entrada' ? 'Compras de estoque' : 'Venda de produtos',
        valor: Math.round(q * vu * 100) / 100, vencimento: v.vencimento || v.data,
        status: quit ? 'pago' : 'pendente', pagamento: quit ? v.data : null, valor_pago: quit ? Math.round(q * vu * 100) / 100 : null
      }]);
      lancId = l.id;
    }
    await DB().insert('movimentos_estoque', [{ empresa_id: p.empresa_id, produto_id: p.id, tipo: v.tipo, quantidade: q, valor_unitario: vu, data: v.data, observacao: v.observacao.trim() || null, lancamento_id: lancId }]);
    // mantém o custo do produto atualizado com o último custo de compra

async function importBackup(file) {
  if (!file) return;
  let data;
  try { data = JSON.parse(await file.text()); } catch (e) { alert('Arquivo inválido.'); return; }
  if (data.app !== 'gestao-a100') { alert('Este arquivo não é um backup deste app.'); return; }
  const counts = DATA_TABLES.map(t => `${t}: ${(data[t] || []).length}`).join('\n');
  if (!confirm(`Importar este backup?\n\n${counts}\n\nRegistros com o mesmo ID serão substituídos; os demais dados são mantidos.`)) return;
  run(async () => {
    for (const t of DATA_TABLES) {
      const rows = data[t] || [];
      if (!rows.length) continue;
      if (mode === 'local') {
        const db = LocalDB.read(); const ids = new Set(rows.map(r => r.id));
        db[t] = [...(db[t] || []).filter(r => !ids.has(r.id)), ...rows]; LocalDB.write(db);
      } else {
        for (let i = 0; i < rows.length; i += 500) {
          const { error } = await sb.from(t).upsert(rows.slice(i, i + 500));
          if (error) throw error;
        }
      }
    }
  }, 'Backup importado');
}

function norm(s) { return String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]/g, ''); }
// datas: dd/mm/aaaa, dd/mm/aa, aaaa-mm-dd, dd-mm-aaaa ou número de série do Excel
function parseData(v) {
  if (v == null || v === '') return null;
  if (typeof v === 'number' && v > 20000 && v < 80000) { const d = new Date(Math.round((v - 25569) * 86400000)); return `${d.getUTCFullYear()}-${String(d.getUTCMonth() + 1).padStart(2, '0')}-${String(d.getUTCDate()).padStart(2, '0')}`; }
  const s = String(v).trim();
  let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if (m) return valida(+m[1], +m[2], +m[3]);
  m = s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})$/);
  if (m) return valida(m[3].length === 2 ? 2000 + +m[3] : +m[3], +m[2], +m[1]);
  return null;
  function valida(y, mo, d) { const dt = new Date(y, mo - 1, d); return dt.getMonth() === mo - 1 && dt.getDate() === d ? isoLocal(dt) : null; }
}
// valores: 1.234,56 · 1234,56 · 1234.56 · R$ 1.234,56 · número do Excel
function parseValor(v) {
  if (v == null || v === '') return null;
  if (typeof v === 'number') return v;
  let s = String(v).replace(/R\$|\s/g, '');
  if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
  const n = Number(s);
  return isFinite(n) ? n : NaN;
}

function baixarModelo(fmt) {
  const L = LAYOUTS[IMP.layout];

    ws['!cols'] = head.map(h => ({ wch: Math.max(14, h.length + 4) }));
    XLSX.utils.book_append_sheet(wb, ws, 'Dados');
    const inst = XLSX.utils.aoa_to_sheet([['Coluna', 'Obrigatória', 'Formato'], ...L.cols.map(c => [c[1], c[2] ? 'Sim' : 'Não', c[3]]),
      [], ['Apague as linhas de exemplo antes de importar. Não mude os nomes das colunas.']]);
    inst['!cols'] = [{ wch: 22 }, { wch: 12 }, { wch: 60 }];
    XLSX.utils.book_append_sheet(wb, inst, 'Instruções');
    XLSX.writeFile(wb, nome + '.xlsx');

  }
  const cell = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';

}
function parseCSV(text) {
  text = text.replace(/^﻿/, '');
  const first = text.split(/\r?\n/)[0] || '';
  const delim = [';', ',', '\t'].sort((a, b) => first.split(b).length - first.split(a).length)[0];
  const rows = []; let row = [], cur = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += c; }
    else if (c === '"') q = true;
    else if (c === delim) { row.push(cur); cur = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(cur); rows.push(row); row = []; cur = ''; }
    else cur += c;
  }
  if (cur !== '' || row.length) { row.push(cur); rows.push(row); }
  return rows;
}
async function lerArquivoImport(file) {
  if (!file) return;
  let matriz;
  try {
    const buf = await file.arrayBuffer();
    if (/\.(xlsx|xls)$/i.test(file.name)) {
      if (!window.XLSX) { alert('Leitor de Excel não carregou. Salve a planilha como CSV e tente de novo.'); return; }
      const wb = XLSX.read(buf, { type: 'array' });
      matriz = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, raw: true, defval: '' });
    } else {
      let text;
      try { text = new TextDecoder('utf-8', { fatal: true }).decode(buf); } catch (e) { text = new TextDecoder('windows-1252').decode(buf); }
      matriz = parseCSV(text);
    }
  } catch (e) { alert('Não foi possível ler o arquivo: ' + e.message); return; }
  matriz = matriz.filter(r => r.some(x => String(x ?? '').trim() !== ''));
  if (matriz.length < 2) { alert('O arquivo não tem linhas de dados (a primeira linha deve ser o cabeçalho).'); return; }
  // liga cada coluna do arquivo a uma coluna do modelo pelo nome
  const L = LAYOUTS[IMP.layout];
  const header = matriz[0].map(norm);
  const idx = {};
  L.cols.forEach(([k, h, , , , alias]) => {
    const nomes = [norm(h), norm(k), ...alias.map(norm)];
    const i = header.findIndex(x => nomes.includes(x));
    if (i >= 0) idx[k] = i;
  });
  const faltando = L.cols.filter(c => c[2] && idx[c[0]] == null).map(c => c[1]);
  if (faltando.length) { alert(`Coluna(s) obrigatória(s) não encontrada(s) no arquivo: ${faltando.join(', ')}.\n\nUse o modelo ou renomeie as colunas da primeira linha.`); return; }
  IMP.arquivo = file.name;
  IMP.brutas = matriz.slice(1).map((r, i) => {
    const o = { _linha: i + 2 };
    for (const k in idx) o[k] = typeof r[idx[k]] === 'string' ? r[idx[k]].trim() : r[idx[k]];
    return o;
  });
  revalidarImport();
  renderTab();
}
function revalidarImport() { if (IMP.brutas) IMP.linhas = validarImport(IMP.layout, IMP.brutas); renderImportPreview(); }

function acharEmpresa(nome) { const n = norm(nome); return D.empresas.find(e => norm(e.nome) === n); }
function acharPorNome(list, nome, emp) { const n = norm(nome); return list.find(x => norm(x.nome) === n && (!emp || !x.empresa_id || x.empresa_id === emp)); }
function mapTipoConta(v) { const n = norm(v); if (/^(p|desp|saida|debito)/.test(n)) return 'pagar'; if (/^(r|rec|entrada|credito)/.test(n)) return 'receber'; return null; }

function validarImport(lay, brutas) {
  const vistos = new Set();
  return brutas.map(b => {
    const r = { linha: b._linha, dados: b, erros: [], avisos: [], cria: [] };
    const exigeEmpresa = ['contas', 'produtos', 'movimentos'].includes(lay);
    let emp = null;
    if (b.empresa) { const e = acharEmpresa(b.empresa); if (e) emp = e.id; else r.erros.push(`Empresa "${b.empresa}" não encontrada`); }
    else if (exigeEmpresa) { emp = IMP.empresa || null; if (!emp) r.erros.push('Escolha a empresa padrão'); }
    r.emp = emp;
    const obrig = (k, nome) => { if (b[k] == null || String(b[k]).trim() === '') { r.erros.push(`${nome} vazio`); return false; } return true; };

    if (lay === 'contas') {
      const tipo = mapTipoConta(b.tipo);
      if (!tipo) r.erros.push('Tipo deve ser Pagar ou Receber'); else if (!canConta(tipo, 'criar')) r.erros.push(`Sem permissão para criar contas a ${tipo}`);
      obrig('descricao', 'Descrição');
      const valor = parseValor(b.valor); if (valor == null || isNaN(valor)) r.erros.push('Valor inválido');
      const venc = parseData(b.vencimento); if (!venc) r.erros.push('Vencimento inválido');
      const sn = norm(b.situacao);
      const status = !sn || sn.startsWith('pend') || sn.startsWith('aberto') ? 'pendente' : /^(pag|pg|quit|receb|liquid|baix)/.test(sn) ? 'pago' : sn.startsWith('canc') ? 'cancelado' : null;
      if (!status) r.erros.push('Situação deve ser Pendente, Pago ou Cancelado');
      let pagamento = null, valorPago = null;
      if (status === 'pago') {
        pagamento = b.pagamento ? parseData(b.pagamento) : venc;
        if (b.pagamento && !pagamento) r.erros.push('Data de pagamento inválida');
        valorPago = b.valor_pago === '' || b.valor_pago == null ? valor : parseValor(b.valor_pago);
        if (isNaN(valorPago)) r.erros.push('Valor pago inválido');
      }
      let parceiro_id = null, servico_id = null;
      if (b.parceiro) {
        const p = acharPorNome(D.parceiros, b.parceiro, emp);
        if (p) parceiro_id = p.id;
        else if (IMP.criar && can('parceiros', 'criar')) r.cria.push(['parceiros', b.parceiro, tipo === 'pagar' ? 'fornecedor' : 'cliente']);
        else r.erros.push(`Cliente/fornecedor "${b.parceiro}" não cadastrado`);
      }
      if (b.servico) {
        const s = acharPorNome(D.servicos, b.servico, emp);
        if (s) servico_id = s.id;
        else if (IMP.criar && can('servicos', 'criar')) r.cria.push(['servicos', b.servico]);
        else r.erros.push(`Serviço "${b.servico}" não cadastrado`);
      }
      let cat = b.categoria ? String(b.categoria).trim() : null;
      if (cat) {
        const c = acharPorNome(D.categorias, cat, emp);
        if (c) cat = c.nome;
        else if (IMP.criar && can('categorias', 'criar')) r.cria.push(['categorias', cat, tipo || 'ambos']);
        else r.avisos.push(`Categoria "${cat}" não cadastrada (será gravada só como texto)`);
      }
      let fc = tipo === 'pagar' && b.forma_compra ? String(b.forma_compra).trim() : null;
      if (fc) {
        const x = D.formas_compra.find(o => norm(o.nome) === norm(fc));
        if (x) fc = x.nome;
        else if (IMP.criar && can('categorias', 'criar')) r.cria.push(['formas_compra', fc]);
        else r.avisos.push(`Forma de compra "${fc}" não cadastrada (será gravada só como texto)`);
      }
      r.row = { empresa_id: emp, tipo, descricao: String(b.descricao ?? '').slice(0, 200), valor, vencimento: venc, status, pagamento, valor_pago: valorPago,
        forma_pagamento: b.forma || null, parceiro_id, servico_id, categoria: cat, observacao: b.observacao || null, forma_compra: fc };
      r.resumo = `${tipo === 'pagar' ? 'Pagar' : tipo === 'receber' ? 'Receber' : '?'} · ${b.descricao || ''} · ${valor != null && !isNaN(valor) ? brl(valor) : '?'} · ${venc ? fmtDate(venc) : '?'}`;
    }
    if (lay === 'parceiros') {
      obrig('nome', 'Nome');
      const tn = norm(b.tipo);
      const tipo = !tn || tn.startsWith('cli') ? 'cliente' : tn.startsWith('forn') ? 'fornecedor' : tn.startsWith('amb') ? 'ambos' : null;
      if (!tipo) r.erros.push('Tipo deve ser Cliente, Fornecedor ou Ambos');

      r.row = { empresa_id: emp, nome: String(b.nome ?? ''), tipo, documento: b.documento || null, telefone: b.telefone ? String(b.telefone) : null, email: b.email || null, observacao: b.observacao || null };
      r.resumo = `${b.nome || ''} · ${TIPO_PARC[tipo] || '?'}`;
    }
    if (lay === 'servicos') {
      obrig('nome', 'Nome');
      const preco = parseValor(b.preco); if (isNaN(preco)) r.erros.push('Preço inválido');
      if (b.nome && (acharPorNome(D.servicos, b.nome, emp) || vistos.has(norm(b.nome)))) r.pular = 'Já cadastrado';
      vistos.add(norm(b.nome));
      r.row = { empresa_id: emp, nome: String(b.nome ?? ''), preco: preco || 0, descricao: b.descricao || null };
      r.resumo = `${b.nome || ''} · ${brl(preco || 0)}`;
    }
    if (lay === 'categorias') {
      obrig('nome', 'Nome');
      const tn = norm(b.tipo);
      const tipo = !tn || tn.startsWith('amb') ? 'ambos' : mapTipoConta(b.tipo);
      if (!tipo) r.erros.push('Tipo deve ser Pagar, Receber ou Ambos');
      if (b.nome && (acharPorNome(D.categorias, b.nome, emp) || vistos.has(norm(b.nome)))) r.pular = 'Já cadastrada';
      vistos.add(norm(b.nome));
      r.row = { empresa_id: emp, nome: String(b.nome ?? ''), tipo, grupo: b.grupo || null, ativo: true };
      r.resumo = `${b.nome || ''} · ${TIPO_CAT[tipo] || '?'}${b.grupo ? ' · ' + b.grupo : ''}`;
    }
    if (lay === 'produtos') {
      obrig('nome', 'Nome');
      const nums = {};
      for (const k of ['estoque_minimo', 'custo', 'preco_venda', 'inicial']) { const x = parseValor(b[k]); if (isNaN(x)) r.erros.push(`${k.replace('_', ' ')} inválido`); nums[k] = x || 0; }
      const ja = D.produtos.find(p => p.empresa_id === emp && (norm(p.nome) === norm(b.nome) || (b.sku && p.sku && norm(p.sku) === norm(b.sku))));
      if (ja || vistos.has(emp + norm(b.nome))) r.pular = 'Já cadastrado';
      vistos.add(emp + norm(b.nome));
      r.row = { empresa_id: emp, nome: String(b.nome ?? ''), sku: b.sku ? String(b.sku) : null, unidade: b.unidade || 'un', estoque_minimo: nums.estoque_minimo, custo: nums.custo, preco_venda: nums.preco_venda };
      r.inicial = nums.inicial;
      r.resumo = `${b.nome || ''}${b.sku ? ' (' + b.sku + ')' : ''} · estoque ${qty(nums.inicial)}`;
    }
    if (lay === 'movimentos') {
      obrig('produto', 'Produto');
      const n = norm(b.produto);
      const p = D.produtos.find(x => x.empresa_id === emp && (norm(x.nome) === n || (x.sku && norm(x.sku) === n)));
      if (b.produto && !p) r.erros.push(`Produto "${b.produto}" não encontrado nesta empresa`);
      const tn = norm(b.tipo);
      const tipo = tn.startsWith('ent') ? 'entrada' : (tn.startsWith('sai') || tn.startsWith('baix') || tn.startsWith('cons')) ? 'saida' : tn.startsWith('aj') ? 'ajuste' : null;
      if (!tipo) r.erros.push('Tipo deve ser Entrada, Saída ou Ajuste');
      let q = parseValor(b.quantidade); if (q == null || isNaN(q) || q === 0) r.erros.push('Quantidade inválida'); else if (tipo !== 'ajuste') q = Math.abs(q);
      const data = parseData(b.data); if (!data) r.erros.push('Data inválida');
      let vu = parseValor(b.valor_unitario); if (isNaN(vu)) r.erros.push('Valor unitário inválido');

    ${L.length > 200 ? `<p class="muted">Mostrando 200 de ${L.length} linhas (os erros aparecem primeiro).</p>` : ''}
    <div class="modal-foot">
      <button class="btn ghost" onclick="IMP.linhas=null; IMP.brutas=null; IMP.arquivo=''; renderTab()">Cancelar</button>
      <button class="btn" ${ok.length ? '' : 'disabled'} onclick="executarImport()">Importar ${ok.length} linha(s)</button>
    </div>`;
}
async function executarImport() {
  const linhas = IMP.linhas.filter(r => r.status === 'ok');
  if (!linhas.length) return;
  if (!confirm(`Importar ${linhas.length} linha(s) de "${LAYOUTS[IMP.layout].nome}"?`)) return;
  const lay = IMP.layout;
  const emLotes = async (t, rows) => { const out = []; for (let i = 0; i < rows.length; i += 500) out.push(...await DB().insert(t, rows.slice(i, i + 500))); return out; };
  const ok = await run(async () => {
    // 1) cadastros que faltam (uma vez por nome)
    const novos = { parceiros: new Map(), servicos: new Map(), categorias: new Map(), formas_compra: new Map() };
    linhas.forEach(r => r.cria.forEach(([t, nome, extra]) => {
      const k = norm(nome);
      if (!novos[t].has(k)) novos[t].set(k, t === 'parceiros' ? { nome, tipo: extra, empresa_id: null } : t === 'servicos' ? { nome, preco: 0, empresa_id: null } : t === 'formas_compra' ? { nome, ativo: true } : { nome, tipo: extra, ativo: true, empresa_id: null });
      else if (['parceiros', 'categorias'].includes(t) && novos[t].get(k).tipo !== extra) novos[t].get(k).tipo = 'ambos';
    }));
    const ids = { parceiros: {}, servicos: {}, categorias: {}, formas_compra: {} };
    for (const t of Object.keys(novos)) {
      if (!novos[t].size) continue;
      const criados = await emLotes(t, [...novos[t].values()]);
      criados.forEach(c => ids[t][norm(c.nome)] = c);
    }
    // 2) os registros
    if (lay === 'contas') {
      await emLotes('lancamentos', linhas.map(r => ({
        ...r.row,
        parceiro_id: r.row.parceiro_id || (r.dados.parceiro ? ids.parceiros[norm(r.dados.parceiro)]?.id : null) || null,
        servico_id: r.row.servico_id || (r.dados.servico ? ids.servicos[norm(r.dados.servico)]?.id : null) || null,
        categoria: r.row.categoria ? (ids.categorias[norm(r.row.categoria)]?.nome || r.row.categoria) : null,
        forma_compra: r.row.forma_compra ? (ids.formas_compra[norm(r.row.forma_compra)]?.nome || r.row.forma_compra) : null
      })));
    } else if (lay === 'produtos') {
      const criados = await emLotes('produtos', linhas.map(r => r.row));
      const movs = criados.map((p, i) => linhas[i].inicial > 0 ? { empresa_id: p.empresa_id, produto_id: p.id, tipo: 'entrada', quantidade: linhas[i].inicial, valor_unitario: p.custo, data: today(), observacao: 'Estoque inicial (importação)' } : null).filter(Boolean);
      if (movs.length) await emLotes('movimentos_estoque', movs);
    } else {
      await emLotes({ parceiros: 'parceiros', servicos: 'servicos', categorias: 'categorias', movimentos: 'movimentos_estoque' }[lay], linhas.map(r => r.row));
    }
  }, `${linhas.length} registro(s) importado(s)`);
  if (ok) { IMP.linhas = null; IMP.brutas = null; IMP.arquivo = ''; renderTab(); }
}

function salvarUsuario(ev, uid) {
  ev.preventDefault();
  const f = ev.target, v = Object.fromEntries(new FormData(f));
  const empresas = [...f.querySelectorAll('input[name=emp]:checked')].map(c => c.value);
  const eu = uid && uid === user?.id;
  const dados = { nome: v.nome.trim(), nivel_id: v.nivel_id || null, admin: eu ? true : !!v.admin, empresas: empresas.length ? empresas : null };
  if (!dados.admin && !dados.nivel_id && !confirm('Este usuário está sem nível de acesso e não vai conseguir ver nada. Salvar assim mesmo?')) return false;
  if (uid) {
    if (!eu) dados.ativo = !!v.ativo;
    run(() => DB().update('perfis', uid, dados), 'Acesso atualizado');
    return false;
  }
  run(async () => {
    // cliente separado para não trocar a sessão do administrador
    const tmp = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false, storageKey: 'cf-novo-usuario' } });
    const { data, error } = await tmp.auth.signUp({ email: v.email.trim(), password: v.senha, options: { data: { nome: dados.nome } } });
    if (error) throw new Error(/signup|sign up/i.test(error.message)
      ? 'O Supabase está com novos cadastros desligados. Ligue "Allow new users to sign up" em Authentication → Sign In / Providers (quem se cadastrar sozinho fica aguardando liberação).'
      : traduzErro(error.message));
    if (!data.user || (data.user.identities && data.user.identities.length === 0)) throw new Error('Este e-mail já tem cadastro. Procure-o na lista e use "Editar".');
    await DB().update('perfis', data.user.id, { ...dados, ativo: true });
    if (!data.session) setTimeout(() => alert('Usuário criado. O Supabase enviou um e-mail de confirmação: a pessoa precisa clicar no link antes de entrar.\n\nPara dispensar a confirmação, desative "Confirm email" no Supabase (Authentication → Sign In / Providers → Email).'), 300);
  }, 'Usuário criado');
  return false;
}
function toggleUsuario(uid) {

      </form>
    </div>`;

async function doLogin(ev, criar) {
  ev.preventDefault();
  const v = Object.fromEntries(new FormData(ev.target));
  const btn = ev.target.querySelector('.btn'); btn.disabled = true; btn.textContent = 'Aguarde…';
  const { data, error } = criar
    ? await sb.auth.signUp({ email: v.email, password: v.senha })
    : await sb.auth.signInWithPassword({ email: v.email, password: v.senha });
  if (error) { renderLogin(traduzErro(error.message), criar); return false; }
  if (criar && !data.session) { renderLogin('Conta criada. Confirme pelo link enviado ao seu e-mail e depois entre.', false); return false; }
  return false; // onAuthStateChange cuida do resto
}
function traduzErro(m) {
  if (/invalid login/i.test(m)) return 'E-mail ou senha incorretos.';
  if (/not confirmed/i.test(m)) return 'Confirme seu e-mail antes de entrar.';
  if (/signups not allowed|signup is disabled/i.test(m)) return 'Novos cadastros estão desativados. Peça acesso ao administrador.';
  if (/already registered/i.test(m)) return 'Este e-mail já tem conta.';
  if (/password should be|at least 6/i.test(m)) return 'A senha precisa ter pelo menos 6 caracteres.';
  if (/rate limit|too many/i.test(m)) return 'Muitas tentativas seguidas. Aguarde alguns minutos e tente de novo.';
  if (/invalid email|email address .* is invalid/i.test(m)) return 'E-mail inválido.';
  return m;
}

    return;
  }
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  sb.auth.onAuthStateChange((event, session) => {
    user = session?.user || null;
    if (user) setTimeout(startApp, 0);
    else { started = false; sb.removeAllChannels(); TABLES.forEach(t => D[t] = []); renderLogin(); }
  });
})();

// tema escuro/claro acompanha o sistema; redesenha gráficos quando muda
window.matchMedia?.('(prefers-color-scheme: dark)').addEventListener?.('change', () => { if (tab === 'dashboard' && !modalOpen) renderTab(); });
</script>
